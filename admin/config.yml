      - { label: "Fato Citável", name: "citable_fact", widget: "string", required: false }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "sopas"
    label: "🥣 Receitas - Sopas Funcionais"
    folder: "receitas/sopas-funcionais"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter" # CORRIGIDO (Baseado no pomodori.html)
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
      - { label: "Nome do Autor", name: "author_name", widget: "string", required: false }
      - { label: "Título do Autor", name: "author_title", widget: "string", required: false }
      - { label: "Fato Citável", name: "citable_fact", widget: "string", required: false }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
