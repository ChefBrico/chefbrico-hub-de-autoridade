# ===================================================================
# PAINEL DE COMANDO v19.0 - CORREÇÃO CRÍTICA
# ===================================================================
# 1. REVERTE o 'format' para "json-frontmatter" (isto corrige o erro fatal).
# 2. ADICIONA o 'frontmatter_delimiter' (isto corrige os campos vazios).
# 3. ADICIONA 'modes: ["rich_text"]' ao body (isto corrige o editor "misturado").
# 4. CORRIGE a Secção 5 para mapear o seu 'meta.json' (isto corrige os campos vazios das Config. Gerais).
# ===================================================================

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "imagens"
public_folder: "/imagens"
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS (FICHEIROS ÚNICOS - JSON-FRONTMATTER) ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais (Home, Chefbox, etc.)"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "index.html"
        format: "json-frontmatter" # <-- CORREÇÃO: Revertido para o valor original
        frontmatter_delimiter: ["---json", "---"] # <-- FIX: Adicionado para parsing correto
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - label: "Conteúdo da Página (HTML)" # <-- FIX: Adicionado 'modes'
            name: "body"
            widget: "markdown"
            modes: ["rich_text"]

      - label: "Página 'ChefBox'"
