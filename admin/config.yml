      - { label: "Página do Autor", name: "author_page", widget: "string", required: false }
      - { label: "Assinatura (Sala)", name: "sala_signature", widget: "string", required: false }
      - { label: "Link CTA", name: "cta_link", widget: "string", required: false }
      - { label: "Texto CTA", name: "cta_texto", widget: "string", required: false }
      - { label: "Texto Opcional CTA", name: "cta_texto_opcional", widget: "string", required: false }
      # O "body" não existe nesta coleção, o texto principal é o "fragmento_texto"

 # --- 5. CONFIGURAÇÕES GERAIS (CORRIGIDO) ---
  - name: "settings"
    label: "⚙️ Configurações Gerais"
    delete: false # Protege contra exclusão acidental
    files:
      - label: "Dados da Empresa e SEO (meta.json)"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        fields:
          - { label: "Domínio Principal", name: "domain", widget: "string" }
          - { label: "Domínio Receitas", name: "recipesDomain", widget: "string" }
          
          # Organização (Agrupamento dos dados da empresa)
          - label: "Dados da Organização"
            name: "organization"
            widget: "object"
            fields:
              - { label: "ID (Schema)", name: "id", widget: "string", default: "https://www.chefbrico.com/#organization" }
              - { label: "Nome da Empresa", name: "name", widget: "string" }
              - { label: "CNPJ", name: "cnpj", widget: "string" }
              - { label: "URL Oficial", name: "url", widget: "string" }
              - { label: "Logo URL", name: "logo", widget: "image" }
              - { label: "Telefone", name: "telephone", widget: "string" }
              - { label: "WhatsApp Link", name: "whatsapp", widget: "string" }
              
              # Endereço (Aninhado dentro de Organization)
              - label: "Endereço Físico"
                name: "address"
                widget: "object"
                fields:
                  - { label: "Tipo", name: "@type", widget: "hidden", default: "PostalAddress" }
                  - { label: "Rua/Logradouro", name: "streetAddress", widget: "string" }
                  - { label: "Cidade/Bairro", name: "addressLocality", widget: "string" }
                  - { label: "Estado (UF)", name: "addressRegion", widget: "string" }
                  - { label: "CEP", name: "postalCode", widget: "string" }
                  - { label: "País", name: "addressCountry", widget: "string", default: "BR" }

              # Redes Sociais (Lista de Objetos)
              - label: "Redes Sociais (SameAs)"
                name: "sameAs"
                widget: "list"
                fields:
                  - { label: "Nome da Rede", name: "name", widget: "string" }
                  - { label: "Link/URL", name: "url", widget: "string" }

              # Fundadora
              - label: "Fundadora"
                name: "founder"
                widget: "object"
                fields:
                  - { label: "Tipo", name: "@type", widget: "hidden", default: "Person" }
                  - { label: "ID da Fundadora", name: "@id", widget: "string" }
