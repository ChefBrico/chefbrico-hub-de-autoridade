# ===================================================================
# PAINEL V22 - O ATELIÊ DA CHEF (LIMPO E ORGANIZADO)
# ===================================================================
# Objetivo: Remover distrações técnicas e permitir foco total na escrita.
# - Editor visual limpo (sem códigos misturados).
# - Campos técnicos isolados.
# - Estrutura robusta que não quebra.
# ===================================================================

backend:
  name: git-gateway
  branch: desenvolvimento

media_folder: "imagens"
public_folder: "/imagens"
locale: 'pt'
publish_mode: editorial_workflow

# -------------------------------------------------------------------
# DEFINIÇÃO DAS COLEÇÕES
# -------------------------------------------------------------------
collections:

  # --- 1. PÁGINAS PRINCIPAIS (Home, ChefBox, etc.) ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout Técnico (Não Mexer)", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Resumo para Google (SEO)", name: "description", widget: "text", required: false }
          - { label: "Dados Técnicos (Schema - Ignorar)", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
          - { label: "📝 Editor Visual (Escreva Aqui)", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Página ChefBox"
        name: "chefbox"
        file: "chefbox/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Dados Técnicos (Schema)", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
          - { label: "📝 Editor Visual", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Clube ChefBrico"
        name: "club"
        file: "clube/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "📝 Editor Visual", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Perguntas Frequentes (FAQ)"
        name: "faq"
        file: "faq/faq.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "📝 Editor Visual", name: "body", widget: "markdown", modes: ["rich_text"] }

  # --- 2. PÁGINAS DE ÍNDICE (Categorias) ---
  - name: "paginas_de_indice"
    label: "🗂️ Índices e Categorias"
    files:
      - label: "Índice: Comida de Verdade"
        name: "idx_comida"
        file: "comida-de-verdade/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Título da Categoria", name: "title", widget: "string" }
          - { label: "Resumo SEO", name: "description", widget: "text", required: false }
          - { label: "📝 Texto de Apresentação", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Índice: Receitas Geral"
        name: "idx_receitas"
        file: "receitas/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Resumo SEO", name: "description", widget: "text", required: false }
          - { label: "📝 Texto de Apresentação", name: "body", widget: "markdown", modes: ["rich_text"] }

  # --- 3. RECEITAS E ARTIGOS (Onde a Mágica Acontece) ---
  # PADRONIZAÇÃO TOTAL: Todas as receitas têm a mesma estrutura limpa.
  
  - name: "risotos"
    label: "🍳 Receitas - Risotos"
    folder: "receitas/risotos"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Layout (Não Mexer)", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Link Permanente (Slug)", name: "permalink", widget: "string", hint: "Ex: /receitas/risotos/meu-novo-risoto/" }
      - { label: "Título da Receita", name: "title", widget: "string" }
      - { label: "Resumo Curto (SEO)", name: "description", widget: "text", hint: "Aparece no Google e no WhatsApp." }
      
      # Bloco de Autoridade (EEAT)
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Cargo/Título", name: "author_title", widget: "string", default: "Fundadora e Chef de Criação" }
      - { label: "Fato Citável (Curiosidade)", name: "citable_fact", widget: "string", required: false }
      
      # Bloco Técnico (Colapsado para não atrapalhar)
      - { label: "⚙️ Dados Técnicos (Schema JSON)", name: "schema", widget: "code", default: "{}", required: false, collapsed: true, hint: "Área técnica. Só mexa se necessário." }
      
      # O Espaço de Criação
      - { label: "📝 Escreva sua Receita Aqui", name: "body", widget: "markdown", modes: ["rich_text"], hint: "Use este espaço para contar a história e o passo a passo." }

  - name: "sopas"
    label: "🥣 Receitas - Sopas"
    folder: "receitas/sopas-funcionais"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Link Permanente", name: "permalink", widget: "string" }
      - { label: "Título da Receita", name: "title", widget: "string" }
      - { label: "Resumo SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Fato Citável", name: "citable_fact", widget: "string", required: false }
      - { label: "⚙️ Dados Técnicos", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
      - { label: "📝 Escreva sua Receita Aqui", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "refeicoes"
    label: "🍲 Refeições Integrais"
    folder: "receitas/refeicoes-integrais"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Título da Receita", name: "title", widget: "string" }
      - { label: "Resumo SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "⚙️ Dados Técnicos", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
      - { label: "📝 Escreva sua Receita Aqui", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "emporio"
    label: "🌶️ Empório da Chef"
    folder: "receitas/emporio-da-chef"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Título do Produto/Receita", name: "title", widget: "string" }
      - { label: "Resumo SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "⚙️ Dados Técnicos", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
      - { label: "📝 Escreva Aqui", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "solucoes"
    label: "🎯 Soluções ChefBrico"
    folder: "receitas/solucoes"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Título da Solução", name: "title", widget: "string" }
      - { label: "Resumo SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "⚙️ Dados Técnicos", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
      - { label: "📝 Escreva Aqui", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "blog"
    label: "✍️ Blog da Chef"
    folder: "blog"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Título do Artigo", name: "title", widget: "string" }
      - { label: "Resumo SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "⚙️ Dados Técnicos", name: "schema", widget: "code", default: "{}", required: false, collapsed: true }
      - { label: "📝 Escreva seu Artigo Aqui", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "bairros"
    label: "📍 Onde Encontrar (Bairros)"
    folder: "onde-encontrar"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Resumo SEO", name: "description", widget: "text" }
      - { label: "📝 Conteúdo da Página", name: "body", widget: "markdown", modes: ["rich_text"] }

  # --- 4. FRAGMENTOS DE CONTEÚDO (IA) ---
  - name: "fragmentos"
    label: "🧩 Fragmentos (Perguntas & Respostas)"
    folder: "fragmentos"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    fields:
      - { label: "Pergunta (Título)", name: "title", widget: "string" }
      - { label: "Resposta (Texto)", name: "fragmento_texto", widget: "markdown" }
      - { label: "Autor da Resposta", name: "author_name", widget: "string", required: false }
      - { label: "Link para Botão (CTA)", name: "cta_link", widget: "string", required: false }

  # --- 5. CONFIGURAÇÕES DA EMPRESA ---
  - name: "settings"
    label: "⚙️ Dados da Empresa"
    delete: false
    files:
      - label: "Informações Gerais"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        fields:
          - { label: "Domínio Principal", name: "domain", widget: "string" }
          - { label: "Domínio da Revista", name: "recipesDomain", widget: "string" }
          - label: "Dados da Organização"
            name: "organization"
            widget: "object"
            fields:
              - { label: "Nome Fantasia", name: "name", widget: "string" }
              - { label: "CNPJ", name: "cnpj", widget: "string" }
              - { label: "Telefone", name: "telephone", widget: "string" }
              - { label: "Link do WhatsApp", name: "whatsapp", widget: "string" }
              - label: "Endereço Completo"
                name: "address"
                widget: "object"
                fields:
                   - { label: "Logradouro", name: "streetAddress", widget: "string" }
                   - { label: "Bairro/Cidade", name: "addressLocality", widget: "string" }
                   - { label: "UF", name: "addressRegion", widget: "string" }
                   - { label: "CEP", name: "postalCode", widget: "string" }
              - label: "Redes Sociais"
                name: "sameAs"
                widget: "list"
                fields:
                   - { label: "Nome da Rede", name: "name", widget: "string" }
                   - { label: "Link do Perfil", name: "url", widget: "string" }
