      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Receita", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      
      # Dados da Autora
      - { label: "Nome do Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Título do Autor", name: "author_title", widget: "string" }
      - { label: "Página do Autor", name: "author_page", widget: "string" }
      - { label: "Fato Citável", name: "citable_fact", widget: "string" }
      - { label: "Assinatura", name: "authority_signature", widget: "string" }

      # Schema (JSON Complexo) - Mantemos oculto para não quebrar o visual, 
      # mas garantimos que ele não "vaze" para o texto.
      - label: "Schema Avançado (Técnico)"
        name: "schema"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Contexto", name: "@context", widget: "hidden", default: "https://schema.org" }
          - { label: "Graph (Dados Estruturados)", name: "@graph", widget: "list", allow_add: true, types: [{label: "Objeto", widget: "object", fields: [{name: "raw", widget: "code", default: "{}"}]}] } 
          # Nota: O Schema é muito complexo para mapear campo a campo sem quebrar o layout atual. 
          # Melhor manter como está no arquivo, mas isolado do Body.

      # O Corpo do Texto - Onde a Maria escreve
      - label: "Conteúdo da Receita (Artigo)"
        name: "body"
        widget: "markdown"
        hint: "Escreva aqui o texto da receita e a história."

