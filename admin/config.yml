      - { label: "Fato Citável", name: "citable_fact", widget: "string" }
      - { label: "Assinatura", name: "authority_signature", widget: "string" }

      # Schema (JSON Complexo) - Mantemos oculto para não quebrar o visual, 
      # mas garantimos que ele não "vaze" para o texto.
      - label: "Schema Avançado (Técnico)"
        name: "schema"
        widget: "object"
        collapsed: true
        fields:
          - { label: "Contexto", name: "@context", widget: "hidden", default: "https://schema.org" }
          - { label: "Graph (Dados Estruturados)", name: "@graph", widget: "list", allow_add: true, types: [{label: "Objeto", widget: "object", fields: [{name: "raw", widget: "code", default: "{}"}]}] } 
          # Nota: O Schema é muito complexo para mapear campo a campo sem quebrar o layout atual. 
