# ===================================================================
# PAINEL DE COMANDO v13.0 - O "MAPA REAL"
# ===================================================================
# 1. Remove a "alucinação" do "src/".
# 2. CORRIGE a "alucinação" do "imagens/uploads" para "imagens".
# 3. Mantém a lógica de separar os "index.html" (v10.0).
# 4. Mantém a lógica "flexível" (required: false) (v11.0).

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "imagens" # CORRIGIDO: Com base no seu feedback
public_folder: "/imagens" # CORRIGIDO: Com base no seu feedback
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS (FICHEIROS ÚNICOS) ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais (Home, Chefbox, etc.)"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown", required: false }

      - label: "Página 'ChefBox'"
        name: "chefbox"
        file: "chefbox/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown", required: false }

      - label: "Página 'Chefbrico Club'"
        name: "club"
        file: "clube/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown", required: false }
      
      - label: "Página de 'Perguntas Frequentes' (FAQ)"
        name: "faq"
        file: "faq/faq.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown", required: false }

