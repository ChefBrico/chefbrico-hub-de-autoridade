# ===================================================================
# PAINEL DE COMANDO v21.0 - PADRONIZAÇÃO COMPLETA
# ===================================================================
# Todas as coleções de receitas agora têm a mesma estrutura rica:
# - SEO
# - Autor
# - Fato Citável
# - Schema Seguro (Code Widget)
# - Conteúdo Rico
# ===================================================================

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "imagens"
public_folder: "/imagens"
locale: 'pt'
publish_mode: editorial_workflow

collections:
  # --- 1. PÁGINAS PRINCIPAIS ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição SEO", name: "description", widget: "text", required: false }
          - { label: "Schema (Técnico)", name: "schema", widget: "code", default: "{}", required: false }
          - { label: "Conteúdo HTML", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Página ChefBox"
        name: "chefbox"
        file: "chefbox/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Conteúdo HTML", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Clube ChefBrico"
        name: "club"
        file: "clube/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Conteúdo HTML", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "FAQ"
        name: "faq"
        file: "faq/faq.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Conteúdo HTML", name: "body", widget: "markdown", modes: ["rich_text"] }

  # --- 2. PÁGINAS DE ÍNDICE ---
  - name: "paginas_de_indice"
    label: "🗂️ Páginas de Índice"
    files:
      - label: "Índice Comida de Verdade"
        name: "idx_comida"
        file: "comida-de-verdade/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown", modes: ["rich_text"] }

      - label: "Índice Receitas Geral"
        name: "idx_receitas"
        file: "receitas/index.html"
        format: "json-frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Conteúdo", name: "body", widget: "markdown", modes: ["rich_text"] }

  # --- 3. RECEITAS E ITENS (PADRONIZADOS) ---
  - name: "risotos"
    label: "🍳 Receitas - Risotos"
    folder: "receitas/risotos"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Fato Citável", name: "citable_fact", widget: "string" }
      - { label: "Schema JSON", name: "schema", widget: "code", default: "{}", required: false }
      - { label: "Conteúdo da Receita", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "sopas"
    label: "🥣 Receitas - Sopas"
    folder: "receitas/sopas-funcionais"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields: # PADRONIZADO COM RISOTOS
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Fato Citável", name: "citable_fact", widget: "string" }
      - { label: "Schema JSON", name: "schema", widget: "code", default: "{}", required: false }
      - { label: "Conteúdo da Receita", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "refeicoes"
    label: "🍲 Refeições Integrais"
    folder: "receitas/refeicoes-integrais"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields: # PADRONIZADO COM RISOTOS
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Fato Citável", name: "citable_fact", widget: "string" }
      - { label: "Schema JSON", name: "schema", widget: "code", default: "{}", required: false }
      - { label: "Conteúdo da Receita", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "emporio"
    label: "🌶️ Empório da Chef"
    folder: "receitas/emporio-da-chef"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields: # PADRONIZADO COM RISOTOS
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Fato Citável", name: "citable_fact", widget: "string" }
      - { label: "Schema JSON", name: "schema", widget: "code", default: "{}", required: false }
      - { label: "Conteúdo da Receita", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "solucoes"
    label: "🎯 Soluções"
    folder: "receitas/solucoes"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields: # PADRONIZADO COM RISOTOS
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Schema JSON", name: "schema", widget: "code", default: "{}", required: false }
      - { label: "Conteúdo da Receita", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "blog"
    label: "✍️ Blog da Chef"
    folder: "blog"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields: # PADRONIZADO
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Schema JSON", name: "schema", widget: "code", default: "{}", required: false }
      - { label: "Conteúdo da Receita", name: "body", widget: "markdown", modes: ["rich_text"] }

  - name: "bairros"
    label: "📍 Onde Encontrar"
    folder: "onde-encontrar"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter"
    frontmatter_delimiter: ["---json", "---"]
    create: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição SEO", name: "description", widget: "text" }
      - { label: "Conteúdo", name: "body", widget: "markdown", modes: ["rich_text"] }

  # --- 4. FRAGMENTOS (Sempre funcionou bem) ---
  - name: "fragmentos"
    label: "🧩 Fragmentos (IA)"
    folder: "fragmentos"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    fields:
      - { label: "Título (Pergunta)", name: "title", widget: "string" }
      - { label: "Texto", name: "fragmento_texto", widget: "markdown" }
      - { label: "Autor", name: "author_name", widget: "string", required: false }
      - { label: "Link CTA", name: "cta_link", widget: "string", required: false }

  # --- 5. CONFIGURAÇÕES GERAIS (CORRIGIDO) ---
  - name: "settings"
    label: "⚙️ Configurações Gerais"
    delete: false
    files:
      - label: "Dados da Empresa"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        fields:
          - { label: "Domínio", name: "domain", widget: "string" }
          - { label: "Domínio Receitas", name: "recipesDomain", widget: "string" }
          - label: "Organização"
            name: "organization"
            widget: "object"
            fields:
              - { label: "Nome", name: "name", widget: "string" }
              - { label: "CNPJ", name: "cnpj", widget: "string" }
              - { label: "Telefone", name: "telephone", widget: "string" }
              - { label: "WhatsApp", name: "whatsapp", widget: "string" }
              - label: "Endereço"
                name: "address"
                widget: "object"
                fields:
                   - { label: "Rua", name: "streetAddress", widget: "string" }
                   - { label: "Bairro", name: "addressLocality", widget: "string" }
                   - { label: "Estado", name: "addressRegion", widget: "string" }
                   - { label: "CEP", name: "postalCode", widget: "string" }
              - label: "Redes Sociais"
                name: "sameAs"
                widget: "list"
                fields:
                   - { label: "Nome da Rede", name: "name", widget: "string" }
                   - { label: "Link URL", name: "url", widget: "string" }
