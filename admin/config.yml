# ===================================================================
# PAINEL DE COMANDO v5.0 - O ESPELHO DA REVISTA DIGITAL
# Criado para ser 100% intuitivo para a Chef Maria Conceição
# ===================================================================

# --- Conexão e Configurações Base ---
backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "imagens/uploads"
public_folder: "/imagens/uploads"
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# Cada coleção representa uma área editável do site.
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS ---
  - name: "paginas"
    label: "📄 Páginas Principais do Site"
    description: "Altere aqui os textos das páginas mais importantes como a Página Inicial, ChefBox, FAQ, etc."
    files:
      - label: "Página Inicial"
        name: "home"
        file: "index.md"
        fields:
          - { label: "Secção Topo - Título", name: "hero_titulo", widget: "string" }
          - { label: "Secção Topo - Subtítulo", name: "hero_subtitulo", widget: "text" }
          - { label: "Secção Catálogo - Título", name: "catalogo_titulo", widget: "string", default: "Nosso Catálogo Inteligente" }
          - { label: "Secção Catálogo - Subtítulo", name: "catalogo_subtitulo", widget: "text" }
          - { label: "Secção Novidades - Título", name: "novidades_titulo", widget: "string", default: "Novidades na Revista" }

      - label: "Página 'Comida de Verdade' (Sobre)"
        name: "sobre"
        file: "comida-de-verdade/index.md"
        fields:
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Conteúdo da Página", name: "body", widget: "markdown" }

      - label: "Página 'ChefBox'"
        name: "chefbox"
        file: "chefbox"
        fields:
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Conteúdo da Página", name: "body", widget: "markdown" }

      - label: "Página 'Chefbrico Club'"
        name: "club"
        file: "clube"
        fields:
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Conteúdo da Página", name: "body", widget: "markdown" }

      - label: "Página 'Onde Encontrar' (Textos e Títulos)"
        name: "onde_encontrar_main"
        file: "onde-encontrar/index"
        fields:
          - { label: "Título Principal da Página", name: "title", widget: "string" }
          - { label: "Título da Secção 'Plano Piloto'", name: "titulo_plano_piloto", widget: "string" }
          - { label: "Título da Secção 'Brasília'", name: "titulo_brasilia", widget: "string" }
          - { label: "Título da Secção 'Próximo a Brasília'", name: "titulo_proximo", widget: "string" }
          - { label: "Texto Final (Pontos de Referência)", name: "texto_final", widget: "text" }
          
      - label: "Página de 'Perguntas Frequentes' (FAQ)"
        name: "faq"
        file: "faq/index"
        fields:
          - { label: "Título da Página", name: "title", widget: "string", default: "Perguntas Frequentes" }
          - { label: "Subtítulo da Página", name: "subtitle", widget: "text" }
          - label: "Grupo de Perguntas: 'Porque Comprar da ChefBrico'"
            name: "faq_grupo_1"
            widget: "list"
            fields:
              - { label: "Pergunta", name: "pergunta", widget: "string" }
              - { label: "Resposta", name: "resposta", widget: "markdown" }
          - label: "Grupo de Perguntas: 'Como Comprar na Loja ChefBrico'"
            name: "faq_grupo_2"
            widget: "list"
            fields:
              - { label: "Pergunta", name: "pergunta", widget: "string" }
              - { label: "Resposta", name: "resposta", widget: "markdown" }

  #  ===================================================================
# --- 2. COLEÇÕES DE RECEITAS (VERSÃO CORRIGIDA E TURBINADA) ---
# Vamos criar um "botão" no painel para CADA pasta de receita.
# ===================================================================

  # --- 2.1 RISOTOS ---
  - name: "risotos"
    label: "🍳 Receitas - Risotos"
    label_singular: "Risoto"
    folder: "receitas/risotos" # <--- A MÁGICA: Ele vai ler a sua pasta de Risotos!
    create: true
    slug: "{{slug}}" # O nome do ficheiro (ex: pomodori)
    
    # "Front Matter" Rígido: Diz ao painel para GERAR o ---json
    format: "json-frontmatter" 
    
    fields:
      # --- Campos de Layout e SEO ---
      - { label: "Layout (Automático)", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink (URL Automático)", name: "permalink", widget: "hidden", hint: "Ex: /receitas/risotos/{{slug}}/" }
      - { label: "Título da Receita (O H1)", name: "title", widget: "string", required: true }
      - { label: "Descrição Curta (para Google/IA)", name: "description", widget: "text", required: true }

      # --- Campos de Autoridade da Chef ---
      - { label: "Nome do Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Título do Autor", name: "author_title", widget: "string", default: "Fundadora e Chef de Criação da ChefBrico" }
      - { label: "Fato Citável (para IA)", name: "citable_fact", widget: "text" }
      
      # ============================================
      # 🚀 INÍCIO DA ADIÇÃO (PASSO 1)
      # ============================================
      - label: "🛒 PREÇO (ex: 34.80)"
        name: "price" 
        widget: "string"
        required: true # Agora é obrigatório
        hint: "O Preço do produto. Use ponto, não vírgula. Ex: 29.90"
        
      - label: "🔑 ID DO PRODUTO SHOPIFY"
        name: "shopify_id" 
        widget: "string"
        required: true # Agora é obrigatório
        hint: "Cole aqui o 'Product Variant ID' completo do Shopify. Ex: gid://shopify/ProductVariant/..."
      # ============================================
      # 🚀 FIM DA ADIÇÃO (PASSO 1)
      # ============================================

      # --- Campos de Conteúdo Avançado ---
      - { label: "Schema JSON-LD (Avançado)", name: "schema", widget: "code", default_language: "json", output_code_only: true, hint: "CUIDADO: Cole APENAS o conteúdo de 'schema': { ... } do ficheiro antigo." }
      - { label: "Conteúdo Principal (HTML/Markdown)", name: "body", widget: "markdown", hint: "O texto principal da página da receita vai aqui." }

  # --- 2.2 SOPAS FUNCIONAIS ---
  - name: "sopas"
    label: "🥣 Receitas - Sopas Funcionais"
    label_singular: "Sopa"
    folder: "receitas/sopas-funcionais" # <--- A MÁGICA
    create: true
    slug: "{{slug}}"
    format: "json-frontmatter" 
    fields:
      # (Copie e cole TODOS os 'fields:' da coleção "risotos" aqui)
      - { label: "Layout (Automático)", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink (URL Automático)", name: "permalink", widget: "hidden", hint: "Ex: /receitas/sopas-funcionais/{{slug}}/" }
      - { label: "Título da Receita (O H1)", name: "title", widget: "string", required: true }
      - { label: "Descrição Curta (para Google/IA)", name: "description", widget: "text", required: true }
      - { label: "Nome do Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Título do Autor", name: "author_title", widget: "string", default: "Fundadora e Chef de Criação da ChefBrico" }
      - { label: "Fato Citável (para IA)", name: "citable_fact", widget: "text" }
      - { label: "🛒 PREÇO (ex: 29.60)", name: "price", widget: "string", required: true, hint: "Use ponto, não vírgula." }
      - { label: "🔑 ID DO PRODUTO SHOPIFY", name: "shopify_id", widget: "string", required: true, hint: "Cole aqui o 'Product Variant ID' completo do Shopify." }
      - { label: "Schema JSON-LD (Avançado)", name: "schema", widget: "code", default_language: "json", output_code_only: true, hint: "CUIDADO: Cole APENAS o conteúdo de 'schema': { ... } do ficheiro antigo." }
      - { label: "Conteúdo Principal (HTML/Markdown)", name: "body", widget: "markdown", hint: "O texto principal da página da receita vai aqui." }

  # --- 2.3 REFEIÇÕES INTEGRAIS ---
  - name: "refeicoes"
    label: "🍲 Receitas - Refeições Integrais"
    label_singular: "Refeição"
    folder: "receitas/refeicoes-integrais" # <--- A MÁGICA
    create: true
    slug: "{{slug}}"
    format: "json-frontmatter" 
    fields:
      # (Copie e cole TODOS os 'fields:' da coleção "risotos" aqui)
      - { label: "Layout (Automático)", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink (URL Automático)", name: "permalink", widget: "hidden", hint: "Ex: /receitas/refeicoes-integrais/{{slug}}/" }
      - { label: "Título da Receita (O H1)", name: "title", widget: "string", required: true }
      - { label: "Descrição Curta (para Google/IA)", name: "description", widget: "text", required: true }
      - { label: "Nome do Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Título do Autor", name: "author_title", widget: "string", default: "Fundadora e Chef de Criação da ChefBrico" }
      - { label: "Fato Citável (para IA)", name: "citable_fact", widget: "text" }
      - { label: "🛒 PREÇO (ex: 34.80)", name: "price", widget: "string", required: true, hint: "Use ponto, não vírgula." }
      - { label: "🔑 ID DO PRODUTO SHOPIFY", name: "shopify_id", widget: "string", required: true, hint: "Cole aqui o 'Product Variant ID' completo do Shopify." }
      - { label: "Schema JSON-LD (Avançado)", name: "schema", widget: "code", default_language: "json", output_code_only: true, hint: "CUIDADO: Cole APENAS o conteúdo de 'schema': { ... } do ficheiro antigo." }
      - { label: "Conteúdo Principal (HTML/Markdown)", name: "body", widget: "markdown", hint: "O texto principal da página da receita vai aqui." }

  # --- 2.4 EMPÓRIO DA CHEF ---
  - name: "emporio"
    label: "🌶️ Receitas - Empório da Chef"
    label_singular: "Produto do Empório"
    folder: "receitas/emporio-da-chef" # <--- A MÁGICA
    create: true
    slug: "{{slug}}"
    format: "json-frontmatter" 
    fields:
      # (Copie e cole TODOS os 'fields:' da coleção "risotos" aqui)
      - { label: "Layout (Automático)", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink (URL Automático)", name: "permalink", widget: "hidden", hint: "Ex: /receitas/emporio-da-chef/{{slug}}/" }
      - { label: "Título da Receita (O H1)", name: "title", widget: "string", required: true }
      - { label: "Descrição Curta (para Google/IA)", name: "description", widget: "text", required: true }
      - { label: "Nome do Autor", name: "author_name", widget: "string", default: "Maria Conceição" }
      - { label: "Título do Autor", name: "author_title", widget: "string", default: "Fundadora e Chef de Criação da ChefBrico" }
      - { label: "Fato Citável (para IA)", name: "citable_fact", widget: "text" }
      - { label: "🛒 PREÇO (ex: 29.80)", name: "price", widget: "string", required: true, hint: "Use ponto, não vírgula." }
      - { label: "🔑 ID DO PRODUTO SHOPIFY", name: "shopify_id", widget: "string", required: true, hint: "Cole aqui o 'Product Variant ID' completo do Shopify." }
      - { label: "Schema JSON-LD (Avançado)", name: "schema", widget: "code", default_language: "json", output_code_only: true, hint: "CUIDADO: Cole APENAS o conteúdo de 'schema': { ... } do ficheiro antigo." }
      - { label: "Conteúdo Principal (HTML/Markdown)", name: "body", widget: "markdown", hint: "O texto principal da página da receita vai aqui." }

# ... (o resto das suas coleções: "blog", "locais", "settings"...)

  # --- 3. BLOG ---
  - name: "blog"
    label: "✍️ Blog da Chef"
    # ... (o resto da coleção do blog continua igual)

  # --- 4. BAIRROS/LOCAIS ---
  - name: "locais"
    label: "📍 Bairros (para a pág. Onde Encontrar)"
    description: "Adicione ou edite os BAIRROS INDIVIDUAIS que aparecerão como botões na página 'Onde Encontrar'."
    # ... (o resto da coleção de locais continua igual)

  # --- 5. CONFIGURAÇÕES GERAIS ---
  - name: "settings"
    label: "⚙️ Configurações Gerais do Site"
    # ... (o resto da coleção de configurações continua igual)
