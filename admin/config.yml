# ===================================================================
# PAINEL DE COMANDO v16.0 - O "MAPA DOS FACTOS" (HÍBRIDO E CORRETO)
# ===================================================================
# 1. Usa os FORMATOS corretos (json-frontmatter e yaml-frontmatter)
#    baseado nos seus exemplos e nos screenshots do que FUNCIONA.
# 2. Usa os NOMES DE CAMPOS corretos (ex: "fragmento_texto" em vez de "body").
# 3. Mantém a lógica de "excluir index.html" e "sem src/".

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "imagens"
public_folder: "/imagens"
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS (FICHEIROS ÚNICOS - JSON-FRONTMATTER) ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais (Home, Chefbox, etc.)"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

      - label: "Página 'ChefBox'"
        name: "chefbox"
        file: "chefbox/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

      - label: "Página 'Chefbrico Club'"
        name: "club"
        file: "clube/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }
      
      - label: "Página de 'Perguntas Frequentes' (FAQ)"
        name: "faq"
        file: "faq/faq.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 2. PÁGINAS DE ÍNDICE (CATEGORIAS - JSON-FRONTMATTER) ---
  - name: "paginas_de_indice"
    label: "🗂️ Páginas de Índice (Categorias)"
    files:
      - { label: "Índice de 'Comida de Verdade'", name: "idx_comida", file: "comida-de-verdade/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }
      - { label: "Índice de 'Receitas' (Geral)", name: "idx_receitas", file: "receitas/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }
      - { label: "Índice de 'Risotos'", name: "idx_risotos", file: "receitas/risotos/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }
      - { label: "Índice de 'Sopas'", name: "idx_sopas", file: "receitas/sopas-funcionais/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }
      - { label: "Índice de 'Refeições'", name: "idx_refeicoes", file: "receitas/refeicoes-integrais/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }
      - { label: "Índice de 'Empório'", name: "idx_emporio", file: "receitas/emporio-da-chef/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }
      - { label: "Índice de 'Onde Encontrar'", name: "idx_onde_encontrar", file: "onde-encontrar/index.html", format: "json-frontmatter", fields: [{ label: "Título", name: "title", widget: "string" }, { label: "Descrição (SEO)", name: "description", widget: "text" }, { label: "Schema (Oculto)", name: "schema", widget: "hidden" }, { label: "Conteúdo (Body)", name: "body", widget: "markdown" }] }

  # --- 3. COLEÇÕES DE ITENS (PASTAS .HTML - JSON-FRONTMATTER) ---
  - name: "comida_de_verdade_itens"
    label: "🥗 Itens 'Comida de Verdade'"
    folder: "comida-de-verdade"
    exclude: "index.html"
    extension: "html"
    format: "json-frontmatter" # CORRIGIDO (Baseado no pomodori.html)
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
      - { label: "Nome do Autor", name: "author_name", widget: "string", required: false }
      - { label: "Título do Autor", name: "author_title", widget: "string", required: false }
      - { label: "Fato Citável", name: "citable_fact", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "risotos"
