      - { label: "Link CTA", name: "cta_link", widget: "string", required: false }
      - { label: "Texto CTA", name: "cta_texto", widget: "string", required: false }
      - { label: "Texto Opcional CTA", name: "cta_texto_opcional", widget: "string", required: false }
      # O "body" não existe nesta coleção, o texto principal é o "fragmento_texto"

  # --- 5. CONFIGURAÇÕES GERAIS ---
  - name: "settings"
    label: "⚙️ Configurações Gerais do Site"
    files:
      - label: "Dados Gerais (meta.json)"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        #
        # DIAGNÓSTICO E CORREÇÃO (PROBLEMA 1: SEÇÃO VAZIA):
        # A configuração anterior (v17.0) definia os campos (siteTitle, etc.) no nível superior.
        # Isso falhou (mostrando uma UI "vazia") porque o ficheiro _data/meta.json real
        # é ANINHADO (ex: { "site": { "title": "..." } }).
        #
        # A correção abaixo (v18.0) usa o `widget: "object"`  para
        # mapear corretamente essa estrutura aninhada.
        #
        # *** AÇÃO: Ajuste o `name:` da linha 257 (ex: "site") para corresponder ao
        # *** nome do objeto principal no seu ficheiro _data/meta.json.
        #
        fields:
          - label: "Dados do Site"
            name: "site" # <-- Este é o nome do objeto JSON principal. AJUSTE SE NECESSÁRIO.
            widget: "object"
            fields:
              - { label: "Título Padrão do Site", name: "title", widget: "string", required: false }
              - { label: "Descrição Padrão do Site", name: "description", widget: "string", required: false }
              - { label: "URL Principal", name: "url", widget: "string", required: false }
