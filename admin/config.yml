      - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown", required: false }

  - name: "risotos"
    label: "🍳 Receitas - Risotos"
    folder: "receitas/risotos"
