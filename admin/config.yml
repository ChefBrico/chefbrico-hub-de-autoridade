  # --- 4. FRAGMENTOS (PASTA .MD - YAML-FRONTMATTER) ---
  - name: "fragmentos"
    label: "🧩 Fragmentos de Conteúdo (IA)"
    folder: "fragmentos"
    extension: "md"
    format: "yaml-frontmatter" # FACTO: Isto está a funcionar
    fields:
      # CAMPOS CORRIGIDOS (Baseado no screenshot 17.11.jpeg)
      - { label: "Layout", name: "layout", widget: "hidden", default: "fragmento-page.njk" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Título (Pergunta)", name: "title", widget: "string" }
      - { label: "Conteúdo (Fragmento)", name: "fragmento_texto", widget: "text" } # A CORREÇÃO-CHAVE
      - { label: "Nome do Autor", name: "author_name", widget: "string", required: false }
      - { label: "Título do Autor", name: "author_title", widget: "string", required: false }
      - { label: "Avatar do Autor", name: "author_avatar", widget: "image", required: false }
      - { label: "Página do Autor", name: "author_page", widget: "string", required: false }
      - { label: "Assinatura (Sala)", name: "sala_signature", widget: "string", required: false }
      - { label: "Link CTA", name: "cta_link", widget: "string", required: false }
      - { label: "Texto CTA", name: "cta_texto", widget: "string", required: false }
      - { label: "Texto Opcional CTA", name: "cta_texto_opcional", widget: "string", required: false }

  # --- 5. CONFIGURAÇÕES GERAIS ---
  - name: "settings"
    label: "⚙️ Configurações Gerais do Site"
    files: 
      - label: "Dados Gerais (meta.json)"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        fields:
          - { label: "Título Padrão do Site", name: "siteTitle", widget: "string", required: false }
          - { label: "Descrição Padrão do Site", name: "siteDescription", widget: "string", required: false }
          - { label: "URL Principal", name: "siteUrl", widget: "string", required: false }
