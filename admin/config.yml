# ===================================================================
# PAINEL DE COMANDO v18.0 (Final) - O "MAPA DOS FACTOS" CORRIGIDO
# ===================================================================
# 1. Aplica as correções para os Problemas 1 (Seção 5 Vazia) e 2 (Editor Misturado).
# 2. Respeita a estrutura JSON/Schema e HTML existente.
# 3. Implementa as correções de "format" e "widget" em todas as coleções.

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "imagens"
public_folder: "/imagens"
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS (FICHEIROS ÚNICOS) ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais (Home, Chefbox, etc.)"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "index.html"
        #
        # DIAGNÓSTICO E CORREÇÃO (PROBLEMA 2: VAZAMENTO DE JSON):
        # O `format: "json-frontmatter"` (v17.0) estava incorreto e causava o "vazamento" de JSON.
        # Os seus ficheiros usam ---json... ---, que é "frontmatter" padrão.
        # A correção (v18.0) muda para `format: "frontmatter"` e define os delimitadores.
        #
        format: "frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          #
          # DIAGNÓSTICO E CORREÇÃO (PROBLEMA 2: HTML BRUTO INUTILIZÁVEL):
          # O `widget: "markdown"` (v17.0) exibia HTML bruto (tags).
          # A correção (v18.0) adiciona `modes: ["rich_text"]`.
          # Isto FORÇA o editor a carregar no modo visual (WYSIWYG), escondendo o
          # código bruto e tornando-o utilizável.
          #
          - label: "Conteúdo da Página (HTML)"
            name: "body"
            widget: "markdown"
            modes: ["rich_text"]

      - label: "Página 'ChefBox'"
        name: "chefbox"
        file: "chefbox/index.html"
        # CORREÇÃO (PROBLEMA 2) APLICADA:
        format: "frontmatter"
        frontmatter_delimiter: ["---json", "---"]
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string", required: false }
          - { label: "Título da Página", name: "title", widget: "string", required: false }
          - { label: "Descrição (SEO)", name: "description", widget: "text", required: false }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden", required: false }
          # CORREÇÃO (PROBLEMA 2) APLICADA:
          - label: "Conteúdo da Página (HTML)"
