# ===================================================================
# PAINEL DE COMANDO v9.0 - A VERSÃO DOS "FACTOS" (SEM ALUCINAÇÕES)
# ===================================================================
# Esta config espelha 100% a estrutura de ficheiros (.html) e
# campos (layout, permalink, title, etc.) provada pelos seus
# screenshots e exemplos de código.

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "src/imagens/uploads"
public_folder: "/imagens/uploads"
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS (FICHEIROS ÚNICOS) ---
  # Estes são os ficheiros .html únicos na raiz ou em pastas próprias.
  - name: "paginas_unicas"
    label: "📄 Páginas Principais (Home, Chefbox, etc.)"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "src/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

      - label: "Página 'ChefBox'"
        name: "chefbox"
        file: "src/chefbox/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

      - label: "Página 'Chefbrico Club'"
        name: "club"
        file: "src/clube/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }
      
      - label: "Página de 'Perguntas Frequentes' (FAQ)"
        name: "faq"
        file: "src/faq/faq.html" # Baseado no screenshot
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 2. COLEÇÃO "COMIDA DE VERDADE" (PASTA .HTML) ---
  - name: "comida_de_verdade"
    label: "🥗 Páginas 'Comida de Verdade'"
    label_singular: "Página 'Comida de Verdade'"
    folder: "src/comida-de-verdade"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 3. COLEÇÕES DE RECEITAS (PASTAS .HTML) ---
  - name: "risotos"
    label: "🍳 Receitas - Risotos"
    label_singular: "Risoto"
    folder: "src/receitas/risotos"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "🛒 PREÇO (ex: 34.80)", name: "price", widget: "string", required: false }
      - { label: "🔑 ID SHOPIFY", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  - name: "sopas"
    label: "🥣 Receitas - Sopas Funcionais"
    folder: "src/receitas/sopas-funcionais"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "🛒 PREÇO (ex: 29.60)", name: "price", widget: "string", required: false }
      - { label: "🔑 ID SHOPIFY", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  - name: "refeicoes"
    label: "🍲 Receitas - Refeições Integrais"
    folder: "src/receitas/refeicoes-integrais"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "🛒 PREÇO (ex: 34.80)", name: "price", widget: "string", required: false }
      - { label: "🔑 ID SHOPIFY", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  - name: "emporio"
    label: "🌶️ Receitas - Empório da Chef"
    folder: "src/receitas/emporio-da-chef"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "🛒 PREÇO (ex: 29.80)", name: "price", widget: "string", required: false }
      - { label: "🔑 ID SHOPIFY", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  - name: "solucoes"
    label: "🎯 Receitas - Soluções"
    folder: "src/receitas/solucoes"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "🛒 PREÇO", name: "price", widget: "string", required: false }
      - { label: "🔑 ID SHOPIFY", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 4. BLOG (PASTA .HTML) ---
  - name: "blog"
    label: "✍️ Blog da Chef"
    label_singular: "Artigo do Blog"
    folder: "src/blog"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 5. PÁGINAS "ONDE ENCONTRAR" (PASTA .HTML) ---
  - name: "bairros"
    label: "📍 Páginas Onde Encontrar"
    label_singular: "Página de Bairro"
    folder: "src/onde-encontrar"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título da Página", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 6. FRAGMENTOS (PASTA .MD - A EXCEÇÃO) ---
  - name: "fragmentos"
    label: "🧩 Fragmentos de Conteúdo (IA)"
    label_singular: "Fragmento"
    folder: "src/fragmentos"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "Título (Uso Interno)", name: "title", widget: "string" }
      - { label: "Conteúdo (Markdown)", name: "body", widget: "markdown" }

  # --- 7. CONFIGURAÇÕES GERAIS (FICHEIRO ÚNICO) ---
  - name: "settings"
    label: "⚙️ Configurações Gerais do Site"
    files: 
      - label: "Dados Gerais (meta.json)"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        fields:
          - { label: "Título Padrão do Site", name: "siteTitle", widget: "string" }
          - { label: "Descrição Padrão do Site", name: "siteDescription", widget: "string" }
          - { label: "URL Principal", name: "siteUrl", widget: "string" }
