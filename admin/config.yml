# ===================================================================
# PAINEL DE COMANDO v10.0 - A VERSÃO DO "MAPA INTELIGENTE"
# ===================================================================
# 1. Exclui os ficheiros "index.html" das coleções de pastas
#    para impedir que o leitor falhe.
# 2. Cria uma nova coleção "Páginas de Índice" para
#    permitir a edição desses ficheiros "index.html".

backend:
  name: git-gateway
  branch: desenvolvimento
media_folder: "src/imagens/uploads"
public_folder: "/imagens/uploads"
locale: 'pt'
publish_mode: editorial_workflow

# ===================================================================
# COLEÇÕES DE CONTEÚDO
# ===================================================================
collections:
  # --- 1. PÁGINAS PRINCIPAIS (FICHEIROS ÚNICOS) ---
  - name: "paginas_unicas"
    label: "📄 Páginas Principais (Home, Chefbox, etc.)"
    files:
      - label: "Página Inicial (Home)"
        name: "home"
        file: "src/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

      - label: "Página 'ChefBox'"
        name: "chefbox"
        file: "src/chefbox/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

      - label: "Página 'Chefbrico Club'"
        name: "club"
        file: "src/clube/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }
      
      - label: "Página de 'Perguntas Frequentes' (FAQ)"
        name: "faq"
        file: "src/faq/faq.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título da Página", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo da Página (HTML)", name: "body", widget: "markdown" }

  # --- 2. PÁGINAS DE ÍNDICE (CATEGORIAS) ---
  - name: "paginas_de_indice"
    label: "🗂️ Páginas de Índice (Categorias)"
    files:
      - label: "Índice de 'Comida de Verdade'"
        name: "idx_comida"
        file: "src/comida-de-verdade/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

      - label: "Índice de 'Receitas' (Geral)"
        name: "idx_receitas"
        file: "src/receitas/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

      - label: "Índice de 'Risotos'"
        name: "idx_risotos"
        file: "src/receitas/risotos/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

      - label: "Índice de 'Sopas'"
        name: "idx_sopas"
        file: "src/receitas/sopas-funcionais/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

      - label: "Índice de 'Refeições'"
        name: "idx_refeicoes"
        file: "src/receitas/refeicoes-integrais/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

      - label: "Índice de 'Empório'"
        name: "idx_emporio"
        file: "src/receitas/emporio-da-chef/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

      - label: "Índice de 'Onde Encontrar'"
        name: "idx_onde_encontrar"
        file: "src/onde-encontrar/index.html"
        format: "json-frontmatter"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
          - { label: "Permalink", name: "permalink", widget: "string" }
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descrição (SEO)", name: "description", widget: "text" }
          - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
          - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  # --- 3. COLEÇÕES DE ITENS (PASTAS .HTML) ---
  - name: "comida_de_verdade_itens"
    label: "🥗 Itens 'Comida de Verdade'"
    folder: "src/comida-de-verdade"
    exclude: "index.html" # <-- A CORREÇÃO MÁGICA
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "risotos"
    label: "🍳 Receitas - Risotos"
    folder: "src/receitas/risotos"
    exclude: "index.html" # <-- A CORREÇÃO MÁGICA
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "sopas"
    label: "🥣 Receitas - Sopas Funcionais"
    folder: "src/receitas/sopas-funcionais"
    exclude: "index.html" # <-- A CORREÇÃO MÁGICA
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "refeicoes"
    label: "🍲 Receitas - Refeições Integrais"
    folder: "src/receitas/refeicoes-integrais"
    exclude: "index.html" # <-- A CORREÇÃO MÁGICA
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "emporio"
    label: "🌶️ Receitas - Empório da Chef"
    folder: "src/receitas/emporio-da-chef"
    exclude: "index.html" # <-- A CORREÇÃO MÁGICA
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "solucoes"
    label: "🎯 Receitas - Soluções"
    folder: "src/receitas/solucoes"
    # Não precisa de "exclude" (não tem index.html na pasta)
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Preço", name: "price", widget: "string", required: false }
      - { label: "ID Shopify", name: "shopify_id", widget: "string", required: false }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "blog"
    label: "✍️ Blog da Chef"
    folder: "src/blog"
    # Não precisa de "exclude" (não tem index.html na pasta)
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "bairros"
    label: "📍 Páginas Onde Encontrar"
    folder: "src/onde-encontrar"
    exclude: "index.html" # <-- A CORREÇÃO MÁGICA
    extension: "html"
    format: "json-frontmatter"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "base.njk" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descrição (SEO)", name: "description", widget: "text" }
      - { label: "Schema (Oculto)", name: "schema", widget: "hidden" }
      - { label: "Conteúdo (Body)", name: "body", widget: "markdown" }

  - name: "fragmentos"
    label: "🧩 Fragmentos de Conteúdo (IA)"
    folder: "src/fragmentos"
    # Não precisa de "exclude" (não tem index.html na pasta)
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "Título (Uso Interno)", name: "title", widget: "string" }
      - { label: "Conteúdo (Markdown)", name: "body", widget: "markdown" }

  # --- 4. CONFIGURAÇÕES GERAIS ---
  - name: "settings"
    label: "⚙️ Configurações Gerais do Site"
    files: 
      - label: "Dados Gerais (meta.json)"
        name: "meta"
        file: "_data/meta.json"
        format: "json"
        fields:
          - { label: "Título Padrão do Site", name: "siteTitle", widget: "string" }
          - { label: "Descrição Padrão do Site", name: "siteDescription", widget: "string" }
          - { label: "URL Principal", name: "siteUrl", widget: "string" }
